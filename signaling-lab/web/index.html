<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Signaling Lab</title>
</head>
<body>
  <h3>Signaling lab: rooms</h3>

  <div>
    <input id="room" placeholder="room name" value="room1">
    <button id="join">Join</button>
  </div>
  <div>
    <input id="msg" placeholder="message to others in the room">
    <button id="send">Send</button>
  </div>
  <pre id="log"></pre>

  <script>
    const logEl = document.getElementById("log");
    const log = (t) => { logEl.textContent += t + "\n"; };

    const ws = new WebSocket("ws://" + location.host + "/ws");
    ws.onopen    = () => log("[open]");
    ws.onclose   = () => log("[closed]");
    ws.onerror   = () => log("[error]");
    ws.onmessage = (e) => log("[recv] " + e.data);

    document.getElementById("join").onclick = () => {
      const room = document.getElementById("room").value;
      ws.send(JSON.stringify({ type: "join", room }));
      log("[sent] join " + room);
    };

    document.getElementById("send").onclick = () => {
      const input = document.getElementById("msg");
      ws.send(JSON.stringify({ type: "chat", data: input.value }));
      log("[sent] chat " + input.value);
      input.value = "";
    };
  </script>
</body>
</html>
